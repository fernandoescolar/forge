editor = { path = "../../vendor/zed/crates/editor" }
git = { path = "../../vendor/zed/crates/git" }
file_icons = { path = "../../vendor/zed/crates/file_icons" }
forge-languages = { path = "../forge-languages" }
forge-tests = { path = "../forge-tests" }
fs = { path = "../../vendor/zed/crates/fs" }
forge-ui = { path = "../forge-ui" }
futures.workspace = true
fuzzy = { path = "../../vendor/zed/crates/fuzzy" }
gpui = { path = "../../vendor/zed/crates/gpui" }
http_client = { path = "../../vendor/zed/crates/http_client" }
language = { path = "../../vendor/zed/crates/language" }
log = "0.4"
lsp = { path = "../../vendor/zed/crates/lsp" }
menu = { path = "../../vendor/zed/crates/menu" }
paths = { path = "../../vendor/zed/crates/paths" }
picker = { path = "../../vendor/zed/crates/picker" }
project = { path = "../../vendor/zed/crates/project" }
