theme = { path = "../../vendor/zed/crates/theme" }
ui = { path = "../../vendor/zed/crates/ui" }
url.workspace = true
util = { path = "../../vendor/zed/crates/util" }
workspace = { path = "../../vendor/zed/crates/workspace" }

[dev-dependencies]
client = { path = "../../vendor/zed/crates/client", features = ["test-support"] }
clock = { path = "../../vendor/zed/crates/clock", features = ["test-support"] }
extension = { path = "../../vendor/zed/crates/extension" }
