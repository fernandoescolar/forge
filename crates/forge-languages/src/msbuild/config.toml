name = "MSBuild"
grammar = "msbuild_xml"
path_suffixes = ["csproj", "fsproj", "vbproj", "sqlproj", "shproj", "projitems", "proj", "props", "targets", "slnx", "nuspec", "resx", "runsettings", "pubxml"]
modeline_aliases = ["msbuild", "xml"]
autoclose_before = ">\""
block_comment = { start = "<!--", prefix = "", end = "-->", tab_size = 0 }
wrap_characters = { start_prefix = "<", start_suffix = ">", end_prefix = "</", end_suffix = ">" }
brackets = [
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "<", end = ">", close = false, newline = true, not_in = ["comment", "string"] },
    { start = "(", end = ")", close = true, newline = false, not_in = ["comment"] },
    { start = "!--", end = " --", close = true, newline = false, not_in = ["comment", "string"] },
]
word_characters = ["-", "."]
completion_query_characters = ["-", "."]
tab_size = 2
