name = "Makefile"
grammar = "make"
path_suffixes = ["Makefile", "makefile", "GNUmakefile", "mk", "mak", "make"]
modeline_aliases = ["make", "makefile"]
line_comments = ["# "]
brackets = [
    { start = "(", end = ")", close = true, newline = false },
    { start = "{", end = "}", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
]
# Recipe lines must start with a tab.
tab_size = 4
hard_tabs = true
