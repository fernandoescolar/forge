[package]
name = "forge-run"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Run targets and run/debug/stop controls for Forge"

[features]
default = ["ui"]
# The run / debug / stop controls, Aspire and the agents' tools. The remote server runs
# target discovery (`host.rs`) without them.
ui = ["dep:forge-ui", "dep:async-net", "dep:async-tungstenite", "dep:dap", "dep:db", "dep:project", "dep:terminal", "dep:terminal_view", "dep:util", "dep:uuid", "dep:workspace", "forge-languages/ui", "forge-tests/ui"]

[dependencies]
forge-ui = { path = "../forge-ui", optional = true }
anyhow.workspace = true
async-net = { version = "2", optional = true }
async-tungstenite = { version = "0.33", optional = true }
dap = { path = "../../vendor/zed/crates/dap", optional = true }
db = { path = "../../vendor/zed/crates/db", optional = true }
forge-languages = { path = "../forge-languages", default-features = false }
forge-host = { path = "../forge-host" }
forge-tests = { path = "../forge-tests", default-features = false }
futures.workspace = true
log = "0.4"
gpui = { path = "../../vendor/zed/crates/gpui" }
project = { path = "../../vendor/zed/crates/project", optional = true }
serde.workspace = true
smol = "2"
serde_json.workspace = true
task = { path = "../../vendor/zed/crates/task" }
terminal = { path = "../../vendor/zed/crates/terminal", optional = true }
terminal_view = { path = "../../vendor/zed/crates/terminal_view", optional = true }
toml = "0.8"
util = { path = "../../vendor/zed/crates/util", optional = true }
uuid = { workspace = true, optional = true }
workspace = { path = "../../vendor/zed/crates/workspace", optional = true }

[dev-dependencies]
editor = { path = "../../vendor/zed/crates/editor", features = ["test-support"] }
gpui = { path = "../../vendor/zed/crates/gpui", features = ["test-support"] }
project = { path = "../../vendor/zed/crates/project", features = ["test-support"] }
settings = { path = "../../vendor/zed/crates/settings", features = ["test-support"] }
theme = { path = "../../vendor/zed/crates/theme" }
theme_settings = { path = "../../vendor/zed/crates/theme_settings" }
workspace = { path = "../../vendor/zed/crates/workspace", features = ["test-support"] }
tempfile.workspace = true
