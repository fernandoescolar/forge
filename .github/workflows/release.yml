# Builds the macOS app for a version tag (v1.2.3, v1.2.3-beta.1), with that version, and
# publishes it as a GitHub release,
# whose zips Forge updates itself from (forge-update). Signs and notarizes when the
# signing secrets are set:
#   MACOS_CERTIFICATE           base64 of the "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD  its password
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool
# Without them the app is ad-hoc signed (Gatekeeper will ask before opening it).
#
# Both architectures build on Apple silicon runners (Intel is cross-compiled: the Intel
# runners take twice as long). A tag can only reuse build caches saved on main, so pushes to
# main that change Zed or the dependencies build too, without publishing anything, to keep
# that cache warm: a release then compiles little more than Forge's own crates.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - vendor/**
      - patches/**
      - extensions/*/sidecar/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-15
    env:
      FORGE_TARGET: ${{ matrix.target }}
      FORGE_UPDATE_REPOSITORY: ${{ github.repository }}
      FORGE_PRECOMPILED_SHADERS: "1"
      # No debug info in release builds made here: much less to compile, link and cache.
      CARGO_PROFILE_RELEASE_DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          # Only main's caches can be restored by the next tag.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        # v1.2.3 or v1.2.3-beta.1 becomes Forge's version (the app's, the zip's, what the
        # updater compares), whatever Cargo.toml says.
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a version tag: use v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          VERSION="$version" perl -0pi -e 's/^version = ".*?"/version = "$ENV{VERSION}"/m' Cargo.toml
          grep -m1 '^version' Cargo.toml
      - name: Apply Forge's patches to Zed
        run: scripts/apply-zed-patches.sh
      - name: Signing identity
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "No signing secrets: the app is ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/forge.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -m1 -o '"Developer ID Application: [^"]*"' | tr -d '"')"
          echo "FORGE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials forge --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
            echo "FORGE_NOTARY_PROFILE=forge" >> "$GITHUB_ENV"
          fi
      - name: Build the app
        run: scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: forge-${{ matrix.target }}
          path: dist/Forge-*.zip

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Forge-*.zip --repo "$GITHUB_REPOSITORY" --title "Forge ${GITHUB_REF_NAME#v}" --generate-notes
