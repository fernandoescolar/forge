# Builds the macOS app and the Linux tarballs for a version tag (v1.2.3, v1.2.3-beta.1),
# with that version, and publishes them as a GitHub release, whose zips and tarballs Forge
# updates itself from (forge-update). Linux builds on Ubuntu 22.04 (its glibc, 2.35, is the
# oldest the tarball runs on), for x86_64 and aarch64. Signs (and notarizes) when the
# signing secrets are set:
#   MACOS_CERTIFICATE           base64 of the .p12: a "Developer ID Application", or Forge's
#                               own self-signed "Forge Signing" (scripts/create-signing-identity.sh
#                               --github sets both secrets)
#   MACOS_CERTIFICATE_PASSWORD  its password
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool (Developer ID only)
# Signed with one certificate, every release is the same app to the keychain: "Always Allow"
# for a saved password survives updates. Only a Developer ID satisfies Gatekeeper for a zip
# downloaded by hand. Without the secrets the app is ad-hoc signed.
#
# Both architectures build on Apple silicon runners (Intel is cross-compiled: the Intel
# runners take twice as long). A tag can only reuse build caches saved on main, so pushes to
# main that change Zed or the dependencies (their lock files, Zed, its patches) build too,
# without publishing anything, to keep that cache warm: a release then compiles little more
# than Forge's own crates. A push to main whose commit is also tagged for a release skips
# that: the tag's run builds it.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    # Only for branch pushes: tag pushes always run.
    paths:
      - Cargo.lock
      - vendor/**
      - patches/**
      - extensions/*/sidecar/Cargo.lock
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Whether to build: always for a tag or by hand; for a push to main, unless the commit has a
  # version tag too (pushed with it: its own run builds and publishes it).
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=true
          if [ "$GITHUB_REF_TYPE" = branch ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            tagged="$(git ls-remote --tags "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" 'refs/tags/v*' | awk -v sha="$GITHUB_SHA" '$1 == sha' | head -n 1)"
            if [ -n "$tagged" ]; then
              echo "This commit is tagged for a release (${tagged##*/}): that run builds it."
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-15
    env:
      FORGE_TARGET: ${{ matrix.target }}
      FORGE_UPDATE_REPOSITORY: ${{ github.repository }}
      FORGE_PRECOMPILED_SHADERS: "1"
      # No debug info in release builds made here: much less to compile, link and cache.
      CARGO_PROFILE_RELEASE_DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          # Only main's caches can be restored by the next tag.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        # v1.2.3 or v1.2.3-beta.1 becomes Forge's version (the app's, the zip's, what the
        # updater compares), whatever Cargo.toml says.
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a version tag: use v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          VERSION="$version" perl -0pi -e 's/^version = ".*?"/version = "$ENV{VERSION}"/m' Cargo.toml
          grep -m1 '^version' Cargo.toml
      - name: Apply Forge's patches to Zed
        run: scripts/apply-zed-patches.sh
      - name: Signing identity
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "No signing secrets: the app is ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/forge.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -m1 -o '"Developer ID Application: [^"]*"' | tr -d '"')"
          if [ -z "$identity" ]; then
            # Forge's self-signed certificate: trusted for code signing on this runner only, so
            # codesign takes it (users' Macs don't need to trust it: the verify job checks that
            # on a runner that doesn't).
            /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/certificate.p12" -nokeys -passin "pass:$MACOS_CERTIFICATE_PASSWORD" | /usr/bin/openssl x509 -out "$RUNNER_TEMP/certificate.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$RUNNER_TEMP/certificate.pem"
            identity="$(security find-identity -v -p codesigning "$keychain" | grep -m1 -o '"[^"]*"' | tr -d '"')"
          fi
          [ -n "$identity" ] || { echo "::error::MACOS_CERTIFICATE holds no code-signing identity"; exit 1; }
          echo "Signing with: $identity"
          echo "FORGE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [[ "$identity" == "Developer ID"* ]]; then
            xcrun notarytool store-credentials forge --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
            echo "FORGE_NOTARY_PROFILE=forge" >> "$GITHUB_ENV"
          fi
      - name: Build the app
        run: scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: forge-${{ matrix.target }}
          path: dist/Forge-*.zip

  build-linux:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      FORGE_UPDATE_REPOSITORY: ${{ github.repository }}
      CARGO_PROFILE_RELEASE_DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the libraries GPUI builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libfontconfig-dev libgit2-dev libssl-dev libva-dev \
            libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev libsqlite3-dev cmake clang lld
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a version tag: use v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          VERSION="$version" perl -0pi -e 's/^version = ".*?"/version = "$ENV{VERSION}"/m' Cargo.toml
          grep -m1 '^version' Cargo.toml
      - name: Apply Forge's patches to Zed
        run: scripts/apply-zed-patches.sh
      - name: Build the tarball
        run: scripts/bundle-linux.sh
      - name: Check that it starts
        # `--printenv` exits before opening a window: the binary and its libraries load.
        run: |
          tar -tzf dist/Forge-*-linux-${{ matrix.arch }}.tar.gz | grep -qx 'forge/bin/forge'
          dist/forge/bin/forge --printenv > /dev/null
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: forge-linux-${{ matrix.arch }}
          path: dist/Forge-*.tar.gz

  # The zips as a user's Mac gets them: on a fresh runner that has never seen (or trusted) the
  # signing certificate, unpacked and checked the way scripts/install.sh and forge-update do.
  verify:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: forge-${{ matrix.target }}
          path: dist
      - name: Verify the signature as a user's Mac will
        run: |
          zip="$(ls dist/Forge-*.zip)"
          ditto -x -k "$zip" unpacked
          codesign --verify --deep --strict --verbose=2 unpacked/Forge.app
          codesign -d -r- unpacked/Forge.app

  publish:
    needs: [build, build-linux, verify]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Forge-*.zip dist/Forge-*.tar.gz --repo "$GITHUB_REPOSITORY" --title "Forge ${GITHUB_REF_NAME#v}" --generate-notes
