[package]
name = "forge-sql"
version = "0.1.0"
edition = "2024"
description = "JSON-lines database sidecar for the Forge DB Explorer extension"
publish = false

[[bin]]
name = "forge-sql"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bson = "=2.15.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures = "0.3"
mongodb = { version = "3", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "chrono", "rust_decimal", "uuid", "json"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono", "rust_decimal", "sql-browser-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "net", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
uuid = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
